name: Android CI - assembleDebug

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.MY_PAT }}

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Install Android commandline tools and SDK
      run: |
        export ANDROID_SDK_ROOT=${{ runner.temp }}/android-sdk
        sudo apt-get update
        sudo apt-get install -y unzip wget lib32stdc++6 lib32gcc1
        mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
        wget https://dl.google.com/android/repository/commandlinetools-linux-9123335_latest.zip -O cmdline.zip
        unzip cmdline.zip -d $HOME/cmdline-tools-temp
        mkdir -p $ANDROID_SDK_ROOT/cmdline-tools/latest
        mv $HOME/cmdline-tools-temp/cmdline-tools/* $ANDROID_SDK_ROOT/cmdline-tools/latest/
        export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH
        yes | sdkmanager --sdk_root=$ANDROID_SDK_ROOT --licenses || true
        sdkmanager --sdk_root=$ANDROID_SDK_ROOT "platform-tools" "platforms;android-36" "build-tools;36.0.0"

    - name: Build Debug APK
      env:
        ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk
        ANDROID_HOME: ${{ runner.temp }}/android-sdk
      run: ./gradlew clean assembleDebug --stacktrace

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
