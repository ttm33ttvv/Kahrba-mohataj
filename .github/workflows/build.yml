name: Android CI Build with Self-Healing

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK (Auto-Healing)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🛠️ Self-Healing: Environment & Dependencies Preparation
        run: |
          echo "==== [1] التحقق من بيئة العمل ومعالجة الملفات الناقصة ===="
          touch .env
          touch .env.example
          touch local.properties
          
          if [ ! -f "app/google-services.json" ]; then
            echo "إنشاء ملف google-services.json افتراضي لتفادي توقف البناء..."
            mkdir -p app
            echo '{"project_info":{"project_number":"1234567890","project_id":"dummy-station-app","storage_bucket":"dummy.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:1234567890:android:abcdef","android_client_info":{"package_name":"com.example"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyDummyKeyForBuildValidation"}],"services":{"analytics_service":{"status":1}}}]}' > app/google-services.json
          fi

          if [ -f "gradlew" ]; then
            chmod +x gradlew
          else
            echo "⚠️ لم يتم العثور على gradlew، جاري تثبيت Gradle وإنشاء Wrapper تلقائياً..."
            sudo apt-get update && sudo apt-get install -y gradle
            gradle wrapper
            chmod +x gradlew
          fi

          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError" > ~/.gradle/gradle.properties
          echo "org.gradle.parallel=true" >> ~/.gradle/gradle.properties

      - name: 🚀 Primary Build Attempt (محاولة البناء الأساسية)
        id: primary_build
        continue-on-error: true
        run: |
          echo "بدء عملية البناء الأساسية مع التخزين المؤقت..."
          ./gradlew assembleDebug --stacktrace --info

      - name: 🩺 Self-Correction & Fallback (التصحيح الذاتي في حال فشل المحاولة الأولى)
        if: steps.primary_build.outcome == 'failure'
        id: fallback_build
        run: |
          echo "⚠️ المحاولة الأولى واجهت عائقاً. جاري تفعيل إجراءات التصحيح الذاتي وإعادة البناء النظيف..."
          ./gradlew --stop || true
          rm -rf ~/.gradle/caches/build-cache-* || true
          
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            echo "إنشاء debug.keystore احتياطي..."
            keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true
          fi

          echo "إعادة تشغيل البناء بوضع الأمان المستقل..."
          ./gradlew clean assembleDebug --no-daemon --no-build-cache --stacktrace

      - name: 📦 Locate & Verify APK (تحديد موقع وتجهيز الحزمة)
        id: apk_locator
        run: |
          echo "البحث عن ملف الـ APK المُنتج..."
          APK_PATH=$(find app/build/outputs/apk/ -name "*.apk" 2>/dev/null | head -n 1)
          if [ -n "$APK_PATH" ]; then
            echo "تم العثور على الـ APK بنجاح: $APK_PATH"
            echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          else
            echo "❌ لم يتم العثور على ملف APK بعد محاولات التصحيح الذاتي."
            exit 1
          fi

      - name: 📤 Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: power-station-debug-apk
          path: ${{ steps.apk_locator.outputs.apk_path }}
          retention-days: 14

      - name: 📋 Capture Diagnostics on Failure (استخراج سجلات التشخيص عند التعثر)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-diagnostics
          path: |
            app/build/reports/
            **/hs_err_pid*.log
          retention-days: 7
