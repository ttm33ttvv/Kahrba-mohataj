name: Build and Deploy

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: استنساخ المستودع
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.MY_PAT }}
    
    - name: إعداد Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: منح صلاحية التنفيذ لـ gradlew
      run: chmod +x gradlew
    
    - name: بناء التطبيق
      run: ./gradlew build
    
    - name: حفظ سجل البناء ورفعه
      env:
        GH_TOKEN: ${{ secrets.MY_PAT }}
      run: |
        echo "✅ تم البناء بنجاح في $(date)" > build.log
        git config user.name "ttm33ttvv"
        git config user.email "ttm33ttvv@users.noreply.github.com"
        git add build.log
        git commit -m "تحديث تلقائي: سجل البناء" || echo "لا تغييرات"
        git push || echo "لا تغييرات للرفع"
